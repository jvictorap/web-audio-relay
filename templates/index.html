<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioSync - Sincronize seu Áudio</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6090477973567187"
     crossorigin="anonymous"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #00ff88; margin-bottom: 30px; }
        .btn { background-color: #00ff88; color: #121212; border: none; padding: 15px 20px; margin: 10px 0; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn:hover { background-color: #00cc6a; }
        .btn-secondary { background-color: #333; color: #fff; }
        .btn-secondary:hover { background-color: #444; }
        .panel { display: none; }
        .active-panel { display: block; }
        input[type="text"] { width: calc(100% - 20px); padding: 15px 10px; margin: 15px 0; border-radius: 8px; border: 1px solid #333; background-color: #2a2a2a; color: #fff; font-size: 24px; text-align: center; letter-spacing: 5px; }
        .pin-display { font-size: 48px; font-weight: bold; color: #00ff88; letter-spacing: 8px; margin: 20px 0; }
        .status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AudioSync 🎧</h1>

        <!-- HUB -->
        <div id="hub-panel" class="panel active-panel">
            <p>O que você deseja fazer?</p>
            <button class="btn" onclick="showPanel('transmit-panel'); setupTransmitter();">💻 Quero Transmitir (PC)</button>
            <button class="btn btn-secondary" onclick="showPanel('receive-panel');">📱 Quero Ouvir (Celular)</button>
        </div>

        <!-- PC -->
        <div id="transmit-panel" class="panel">
            <h2>Modo Transmissão</h2>
            <p>Seu código de acesso é:</p>
            <div id="pin-display" class="pin-display">----</div>
            <button id="btn-start-transmit" class="btn" onclick="startTransmitting()">Iniciar Transmissão</button>
            <button class="btn btn-secondary" onclick="resetApp()">Voltar</button>
            <p id="transmit-status" class="status">Aguardando início...</p>
        </div>

        <!-- CELULAR -->
        <div id="receive-panel" class="panel">
            <h2>Modo Recepção</h2>
            <p>Digite o PIN mostrado no PC:</p>
            <input type="text" id="pin-input" placeholder="0000" maxlength="4">
            <button class="btn" onclick="startReceiving()">Conectar e Ouvir</button>
            <button class="btn btn-secondary" onclick="resetApp()">Voltar</button>
            <p id="receive-status" class="status">Aguardando conexão...</p>
        </div>
    </div>

    <!-- Elemento de Áudio Oculto -->
    <audio id="remoteAudio" autoplay playsinline style="display: none;"></audio>

    <script>
        let ws;
        let peerConnections = {}; // Agora é um Dicionário para suportar vários celulares!
        let localStream;
        let currentPin;
        let myId; // Identificador único para cada dispositivo na sala

        const iceConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function showPanel(panelId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active-panel'));
            document.getElementById(panelId).classList.add('active-panel');
        }

        function resetApp() {
            if (ws) ws.close();
            // Desconecta todos os celulares logados
            Object.values(peerConnections).forEach(pc => pc.close());
            peerConnections = {};
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            showPanel('hub-panel');
            document.getElementById('transmit-status').innerText = "Aguardando início...";
            document.getElementById('receive-status').innerText = "Aguardando conexão...";
        }

        /* =========================================
           LÓGICA DO TRANSMISSOR (PC)
           ========================================= */
        function setupTransmitter() {
            currentPin = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('pin-display').innerText = currentPin;
        }

        async function startTransmitting() {
            const statusText = document.getElementById('transmit-status');
            myId = 'host'; // O PC sempre será o 'host'
            
            try {
                // CAPTURA DE ÁUDIO COM QUALIDADE DE ESTÚDIO
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: {
                        echoCancellation: false,   // Tira o som de aquário/robô
                        noiseSuppression: false,   // Mantém os graves e a qualidade
                        autoGainControl: false,    // Evita que o volume fique subindo e descendo
                        channelCount: 2            // Força áudio estéreo
                    }
                });

                if (localStream.getAudioTracks().length === 0) {
                    alert("⚠️ Você esqueceu de marcar a opção 'Compartilhar áudio do sistema' na janela do navegador!");
                    resetApp();
                    return;
                }

                const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
                ws = new WebSocket(protocol + location.host + '/audio/' + currentPin);

                ws.onopen = () => { statusText.innerText = "Sala aberta. Aguardando ouvintes... ⏳"; };

                ws.onmessage = async (event) => {
                    const msg = JSON.parse(event.data);

                    // Só escuta mensagens destinadas ao host
                    if (msg.target !== myId) return;

                    // UM NOVO CELULAR ENTROU NA SALA
                    if (msg.type === 'join') {
                        const phoneId = msg.from;
                        const pc = new RTCPeerConnection(iceConfig);
                        peerConnections[phoneId] = pc; // Salva a conexão específica desse celular

                        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                        pc.onicecandidate = e => {
                            if (e.candidate) ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate, from: myId, target: phoneId }));
                        };

                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        ws.send(JSON.stringify({ type: 'offer', sdp: offer, from: myId, target: phoneId }));
                        
                        // Atualiza a tela com o número de pessoas ouvindo
                        const listeners = Object.keys(peerConnections).length;
                        statusText.innerText = `Transmissão ATIVA! 🔴 (${listeners} ouvinte${listeners > 1 ? 's' : ''})`;
                        statusText.style.color = "#00ff88";
                    } 
                    // RESPOSTA DO CELULAR
                    else if (msg.type === 'answer') {
                        const pc = peerConnections[msg.from];
                        if (pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                    } 
                    // NEGOCIAÇÃO DE ROTA
                    else if (msg.type === 'ice') {
                        const pc = peerConnections[msg.from];
                        if (pc) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                    }
                };

                localStream.getVideoTracks()[0].onended = () => resetApp();

            } catch (err) {
                statusText.innerText = "Erro ao capturar tela. Tente novamente.";
            }
        }

        /* =========================================
           LÓGICA DO RECEPTOR (CELULAR)
           ========================================= */
        function startReceiving() {
            const pinInput = document.getElementById('pin-input').value;
            const statusText = document.getElementById('receive-status');

            if (pinInput.length !== 4) return alert("Digite um PIN de 4 dígitos.");

            // Gera um ID único aleatório para este celular
            myId = Math.random().toString(36).substring(2, 10);

            const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + location.host + '/audio/' + pinInput);

            ws.onopen = () => {
                statusText.innerText = "Conectando ao PC... ⏳";
                // Envia aviso de entrada incluindo quem é ele e quem ele procura ('host')
                ws.send(JSON.stringify({ type: 'join', from: myId, target: 'host' }));
            };

            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);

                // Ignora mensagens que sejam para outros celulares na mesma sala
                if (msg.target !== myId) return;

                if (!peerConnections['host']) {
                    const pc = new RTCPeerConnection(iceConfig);
                    peerConnections['host'] = pc;
                    
                    pc.onicecandidate = e => {
                        if (e.candidate) ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate, from: myId, target: 'host' }));
                    };
                    
                    pc.ontrack = e => {
                        const audioElement = document.getElementById('remoteAudio');
                        audioElement.srcObject = e.streams[0];
                        audioElement.play().catch(err => console.log("Aguardando clique do usuário para tocar"));
                        
                        statusText.innerText = "Conectado! Som na caixa! 🔊";
                        statusText.style.color = "#00ff88";
                    };
                }

                const pc = peerConnections['host'];

                if (msg.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    ws.send(JSON.stringify({ type: 'answer', sdp: answer, from: myId, target: 'host' }));
                } 
                else if (msg.type === 'ice') {
                    await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                }
            };
        }
    </script>
