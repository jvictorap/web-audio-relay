<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receber | Landell Áudio-PC</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #0a0a0a; color: #e0e0e0; text-align: center; padding: 50px 20px; margin: 0; }
        .container { background: #141414; padding: 40px; border-radius: 12px; max-width: 400px; margin: 0 auto; border: 1px solid #222; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        h2 { color: #ffffff; margin-top: 0; }
        input[type="text"] { width: calc(100% - 30px); padding: 15px; margin: 20px 0; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 24px; text-align: center; letter-spacing: 5px; box-sizing: border-box;}
        input[type="text"]:focus { outline: 1px solid #00e676; }
        .btn { width: 100%; background: #00e676; color: #000; padding: 15px 30px; border: none; border-radius: 30px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3); }
        .btn:hover { background: #00c765; transform: translateY(-2px); }
        .status { margin-top: 20px; color: #aaa; font-size: 1rem; }
        a.voltar { color: #00e676; text-decoration: none; display: inline-block; margin-top: 30px; font-size: 0.9rem; }
        a.voltar:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Modo Recepção (Celular)</h2>
        <p>Digite o PIN mostrado no PC:</p>
        
        <input type="text" id="pin-input" placeholder="0000" maxlength="4">
        <button class="btn" onclick="startReceiving()">Conectar e Ouvir</button>
        <p id="receive-status" class="status">Aguardando conexão...</p>
        
        <a href="/" class="voltar">&larr; Voltar ao Início</a>
    </div>

    <!-- Elemento crucial para tocar o som no celular -->
    <audio id="remoteAudio" autoplay playsinline style="display: none;"></audio>

    <script>
        let ws;
        let peerConnections = {};
        let myId;
        const iceConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function startReceiving() {
            const pinInput = document.getElementById('pin-input').value;
            const statusText = document.getElementById('receive-status');

            if (pinInput.length !== 4) return alert("Digite um PIN de 4 dígitos.");

            myId = Math.random().toString(36).substring(2, 10);
            
            const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + location.host + '/audio/' + pinInput);

            ws.onopen = () => {
                statusText.innerText = "Conectando ao PC... ⏳";
                ws.send(JSON.stringify({ type: 'join', from: myId, target: 'host' }));
            };

            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                if (msg.target !== myId) return;

                if (!peerConnections['host']) {
                    const pc = new RTCPeerConnection(iceConfig);
                    peerConnections['host'] = pc;
                    
                    pc.onicecandidate = e => {
                        if (e.candidate) ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate, from: myId, target: 'host' }));
                    };
                    
                    pc.ontrack = e => {
                        const audioElement = document.getElementById('remoteAudio');
                        audioElement.srcObject = e.streams[0];
                        audioElement.play().catch(err => console.log("Aguardando clique do usuário para tocar"));
                        
                        statusText.innerText = "Conectado! Som na caixa! 🔊";
                        statusText.style.color = "#00e676";
                    };
                }

                const pc = peerConnections['host'];

                if (msg.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    ws.send(JSON.stringify({ type: 'answer', sdp: answer, from: myId, target: 'host' }));
                } 
                else if (msg.type === 'ice') {
                    await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                }
            };
        }
    </script>
</body>
</html>
