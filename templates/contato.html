<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Landell Áudio-PC</title>
    <style>
        :root {
            --bg-page: #0a0a0a;
            --bg-container: #141414;
            --bg-header: #000000;
            --accent-green: #00e676;
            --text-main: #e0e0e0;
            --border-color: #222222;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            background-color: var(--bg-header);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-brand {
            color: var(--accent-green);
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
            padding: 5px 10px;
        }

        .nav-links a:hover {
            color: var(--accent-green);
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            background: var(--bg-container);
            padding: 50px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            color: #ffffff;
            margin-top: 0;
            font-size: 2rem;
        }

        p {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .email-box {
            display: inline-block;
            background-color: var(--bg-header);
            border: 1px dashed var(--accent-green);
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 1.3rem;
            font-family: 'Courier New', Courier, monospace;
            color: var(--accent-green);
            letter-spacing: 1px;
        }

        .email-box a {
            color: var(--accent-green);
            text-decoration: none;
        }
        
        .email-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-brand">LANDELL ÁUDIO-PC</a>
        <div class="nav-links">
            <a href="/">Início</a>
            <a href="/como-funciona">Como Funciona</a>
        </div>
    </nav>

    <div class="container">
        <h2>Fale Conosco</h2>
        <p>Precisa de suporte técnico ou tem alguma dúvida comercial? Envie um e-mail para a nossa equipe.</p>
        
        <div class="email-box">
            <!-- Substitua o e-mail abaixo pelo seu e-mail profissional quando criar -->
            <a href="mailto:contato@landellsync.com.br">contato@landellsync.com.br</a>
        </div>
    </div>

</body>
</html>
