<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Transmissão | Landell Áudio-PC</title>
    
    <style>
        :root {
            --bg-page: #0a0a0a;
            --bg-container: #141414;
            --bg-header: #000000;
            --accent-green: #00e676;
            --accent-red: #ff1744;
            --text-main: #e0e0e0;
            --text-white: #ffffff;
            --border-color: #222222;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            color: var(--text-main);
        }

        nav {
            background-color: var(--bg-header);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-brand {
            color: var(--accent-green);
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: var(--bg-container);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            color: var(--text-white);
            margin-top: 0;
        }

        .pin-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 4rem;
            font-weight: bold;
            color: var(--accent-green);
            background: var(--bg-header);
            padding: 20px;
            border-radius: 8px;
            border: 2px dashed var(--accent-green);
            margin: 30px 0;
            letter-spacing: 5px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            background-color: #333;
            color: #aaa;
            margin-bottom: 20px;
        }

        .status-badge.active {
            background-color: rgba(0, 230, 118, 0.2);
            color: var(--accent-green);
        }

        .btn-action {
            display: inline-block;
            background-color: var(--accent-green);
            color: #000;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }

        .btn-stop {
            background-color: transparent;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .btn-stop:hover {
            background-color: rgba(255, 23, 68, 0.1);
            box-shadow: none;
        }

        .instrucao {
            font-size: 0.9rem;
            color: #888;
            margin-top: 20px;
        }
        /* Adicione isso no final do seu bloco <style> */
        .btn-voltar {
            display: inline-block;
            margin-top: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }
        .btn-voltar:hover {
            color: var(--neon-green);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-brand">LANDELL ÁUDIO-PC</a>
    </nav>

    <div class="container">
        <h2>Painel de Transmissão</h2>
        
        <div id="status" class="status-badge">Aguardando Início</div>

        <p>Acesse o site no seu celular e digite o PIN abaixo:</p>
        
        <div class="pin-display" id="pin-code">----</div>

        <button class="btn-action" id="btn-start">Capturar Áudio do PC</button>
        <button class="btn-action btn-stop" id="btn-stop" style="display: none;">Encerrar Transmissão</button>

        <p class="instrucao">Aviso: Quando solicitado pelo navegador, escolha compartilhar a tela/guia marcando a opção "Compartilhar áudio do sistema".</p>

        <a href="/" class="btn-voltar">&larr; Voltar ao Início</a>
    </div>

    <!-- Apenas o JavaScript foi modificado aqui -->
    <script>
        const pinDisplay = document.getElementById('pin-code');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const statusBadge = document.getElementById('status');

        let ws = null;
        let peerConnections = {};
        let localStream = null;
        let currentPin = '';
        let myId = 'host';
        const iceConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function generatePIN() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        btnStart.addEventListener('click', async () => {
            try {
                // Captura via WebRTC
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        channelCount: 2,
                        latency: 0
                    }
                });

                if (localStream.getAudioTracks().length === 0) {
                    alert("Você esqueceu de marcar a opção 'Compartilhar áudio do sistema/guia'. Tente novamente.");
                    localStream.getTracks().forEach(track => track.stop());
                    return;
                }

                currentPin = generatePIN();
                pinDisplay.innerText = currentPin;

                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/audio/${currentPin}`;
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    statusBadge.innerText = "Aguardando Celular...";
                    statusBadge.classList.add("active");
                    btnStart.style.display = 'none';
                    btnStop.style.display = 'inline-block';
                };

                // Gerencia a conexão com os celulares
                ws.onmessage = async (event) => {
                    const msg = JSON.parse(event.data);
                    if (msg.target !== myId) return;

                    if (msg.type === 'join') {
                        const phoneId = msg.from;
                        const pc = new RTCPeerConnection(iceConfig);
                        peerConnections[phoneId] = pc;

                        localStream.getAudioTracks().forEach(track => pc.addTrack(track, localStream));

                        pc.onicecandidate = e => {
                            if (e.candidate) ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate, from: myId, target: phoneId }));
                        };

                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        ws.send(JSON.stringify({ type: 'offer', sdp: offer, from: myId, target: phoneId }));

                        const listeners = Object.keys(peerConnections).length;
                        statusBadge.innerText = `Transmissão Ativa (${listeners} Ouvinte${listeners > 1 ? 's' : ''})`;
                    }
                    else if (msg.type === 'answer') {
                        const pc = peerConnections[msg.from];
                        if (pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                    }
                    else if (msg.type === 'ice') {
                        const pc = peerConnections[msg.from];
                        if (pc) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                    }
                };

                ws.onclose = () => resetUI();
                ws.onerror = () => { alert("Erro no servidor."); resetUI(); };

                localStream.getVideoTracks()[0].onended = () => desconectar();

            } catch (err) {
                console.error("Erro ao capturar mídia: ", err);
            }
        });

        btnStop.addEventListener('click', desconectar);

        function desconectar() {
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            Object.values(peerConnections).forEach(pc => pc.close());
            peerConnections = {};
            if (ws) ws.close();
            resetUI();
        }

        function resetUI() {
            pinDisplay.innerText = "----";
            statusBadge.innerText = "Aguardando Início";
            statusBadge.classList.remove("active");
            btnStart.style.display = 'inline-block';
            btnStop.style.display = 'none';
        }
    </script>
</body>
</html>
