<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmitir | Landell Áudio-PC</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #0a0a0a; color: #e0e0e0; text-align: center; padding: 50px 20px; margin: 0; }
        .container { background: #141414; padding: 40px; border-radius: 12px; max-width: 500px; margin: 0 auto; border: 1px solid #222; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        h2 { color: #ffffff; margin-top: 0; }
        .pin-display { font-size: 60px; color: #00e676; font-weight: bold; letter-spacing: 10px; margin: 20px 0; }
        .btn { background: #00e676; color: #000; padding: 15px 30px; border: none; border-radius: 30px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3); }
        .btn:hover { background: #00c765; transform: translateY(-2px); }
        .status { margin-top: 20px; color: #aaa; font-size: 1rem; }
        a.voltar { color: #00e676; text-decoration: none; display: inline-block; margin-top: 30px; font-size: 0.9rem; }
        a.voltar:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Modo Transmissão (PC)</h2>
        <p>Seu código de acesso é:</p>
        
        <!-- O PIN será gerado aqui -->
        <div id="pin-display" class="pin-display">----</div>
        
        <button class="btn" onclick="startTransmitting()">Iniciar Transmissão</button>
        <p id="transmit-status" class="status">Aguardando início...</p>
        
        <a href="/" class="voltar">&larr; Voltar ao Início</a>
    </div>

    <script>
        let ws;
        let peerConnections = {};
        let localStream;
        let currentPin;
        let myId = 'host';
        const iceConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // Gera o PIN assim que a página carrega
        window.onload = () => {
            currentPin = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('pin-display').innerText = currentPin;
        };

        async function startTransmitting() {
            const statusText = document.getElementById('transmit-status');
            try {
                // Solicita a captura de áudio do sistema
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2 }
                });

                if (localStream.getAudioTracks().length === 0) {
                    alert("⚠️ Você esqueceu de marcar a opção 'Compartilhar áudio do sistema' na janela do navegador!");
                    return;
                }

                // Conecta ao WebSocket do Flask
                const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
                ws = new WebSocket(protocol + location.host + '/audio/' + currentPin);

                ws.onopen = () => { statusText.innerText = "Sala aberta. Aguardando celular conectar... ⏳"; };

                ws.onmessage = async (event) => {
                    const msg = JSON.parse(event.data);
                    if (msg.target !== myId) return;

                    if (msg.type === 'join') {
                        const phoneId = msg.from;
                        const pc = new RTCPeerConnection(iceConfig);
                        peerConnections[phoneId] = pc;

                        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                        pc.onicecandidate = e => {
                            if (e.candidate) ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate, from: myId, target: phoneId }));
                        };

                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        ws.send(JSON.stringify({ type: 'offer', sdp: offer, from: myId, target: phoneId }));
                        
                        const listeners = Object.keys(peerConnections).length;
                        statusText.innerText = `Transmissão ATIVA! 🔴 (${listeners} ouvinte${listeners > 1 ? 's' : ''})`;
                        statusText.style.color = "#00e676";
                    } 
                    else if (msg.type === 'answer') {
                        const pc = peerConnections[msg.from];
                        if (pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                    } 
                    else if (msg.type === 'ice') {
                        const pc = peerConnections[msg.from];
                        if (pc) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                    }
                };
            } catch (err) {
                statusText.innerText = "Erro ao capturar tela/áudio. Tente novamente.";
            }
        }
    </script>
</body>
</html>
